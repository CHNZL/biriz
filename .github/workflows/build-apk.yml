name: BİRİZ APK Otomatik Derleme ve Sürüm Dağıtımı

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Biriz.apk Derleme ve GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Gradle Kurulumu
        uses: gradle/actions/setup-gradle@v3

      - name: Gradlew Çalıştırma İzni Ver
        run: chmod +x gradlew

      - name: Debug Keystore Hazırla (Resmi Firebase Onaylı SHA-1)
        run: |
          python3 scripts/setup_keystore.py
          ls -lh debug.keystore

      - name: Google Services Yapılandırmasını Doğrula
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "google-services.json bulunamadı, derleme için yapılandırma oluşturuluyor..."
            mkdir -p app
            cat << 'EOF' > app/google-services.json
            {
              "project_info": {
                "project_number": "1053897004873",
                "project_id": "gen-lang-client-0343498023",
                "storage_bucket": "gen-lang-client-0343498023.firebasestorage.app"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:1053897004873:android:a5488f645553ac684a6c98",
                    "android_client_info": {
                      "package_name": "com.aistudio.biriz.sclvpk"
                    }
                  },
                  "oauth_client": [
                    {
                      "client_id": "1053897004873-s0gplmvfrfmsdqajb076el3chkmf3ltk.apps.googleusercontent.com",
                      "client_type": 3
                    }
                  ],
                  "api_key": [
                    {
                      "current_key": "AIzaSyB0ROPrr0nA0ll9KnNyDu-m0NCELgoMsnw"
                    }
                  ],
                  "services": {}
                }
              ],
              "configuration_version": "1"
            }
          EOF
          fi

      - name: Android APK'sını Derle (Biriz.apk)
        run: |
          ./gradlew assembleDebug -PGITHUB_RUN_NUMBER=${{ github.run_number }} -PGITHUB_REPOSITORY=${{ github.repository }} --no-daemon

      - name: Çıktı Dosyalarını ve Sürüm Bilgilerini Hazırla
        run: |
          RUN_NUM="${{ github.run_number }}"
          REPO="${{ github.repository }}"
          VERSION_CODE=$((1000 + RUN_NUM))
          if [ "$RUN_NUM" -lt 100 ]; then
            VERSION_NAME="1.0.${RUN_NUM}"
          else
            MINOR=$((RUN_NUM / 100))
            PATCH=$((RUN_NUM % 100))
            VERSION_NAME=$(printf "1.%02d.%02d" "$MINOR" "$PATCH")
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"

          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Biriz.apk
          cp app/build/outputs/apk/debug/app-debug.apk "release-output/Biriz-v${VERSION_NAME}.apk"

          cat <<EOF > release-output/version.json
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "tag": "v${VERSION_NAME}",
            "apkUrl": "https://github.com/${REPO}/releases/download/v${VERSION_NAME}/Biriz.apk",
            "appName": "BİRİZ",
            "releaseNotes": "BİRİZ v${VERSION_NAME} otomatik derlemesi oluşturuldu."
          }
          EOF

          cat <<EOF > release-notes.md
          ### 🚀 BİRİZ Android Uygulaması (v${VERSION_NAME})

          Bu sürüm GitHub senkronizasyonu ile otomatik olarak derlenmiştir.

          #### 📲 İndirme Seçenekleri:
          - **Doğrudan APK İndir:** [Biriz.apk](https://github.com/${REPO}/releases/download/v${VERSION_NAME}/Biriz.apk)
          - **Sürümlü APK:** [Biriz-v${VERSION_NAME}.apk](https://github.com/${REPO}/releases/download/v${VERSION_NAME}/Biriz-v${VERSION_NAME}.apk)

          *Uygulamayı açtığınızda otomatik olarak yeni sürüm uyarısı verilecek veya Ayarlar > Güncellemeleri Denetle butonuyla da tek tıkla güncelleyebilirsiniz.*
          EOF

      - name: GitHub Sürümü (Release) Oluştur ve APK'yı Yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ env.VERSION_NAME }}" \
            release-output/Biriz.apk \
            "release-output/Biriz-v${{ env.VERSION_NAME }}.apk" \
            release-output/version.json \
            --title "BİRİZ v${{ env.VERSION_NAME }}" \
            --notes-file release-notes.md

      - name: APK Dosyasını Artifact Olarak Sakla
        uses: actions/upload-artifact@v4
        with:
          name: "Biriz-APK-v${{ env.VERSION_NAME }}"
          path: release-output/Biriz.apk
          retention-days: 30
