name: BİRİZ APK Otomatik Derleme ve Sürüm Dağıtımı

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Biriz.apk Derleme ve GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Gradle Kurulumu
        uses: gradle/actions/setup-gradle@v3

      - name: Gradlew Çalıştırma İzni Ver
        run: chmod +x gradlew

      - name: Debug Keystore Hazırla
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "debug.keystore.base64 dosyasından debug.keystore çözümleniyor..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Yeni debug.keystore oluşturuluyor..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore

      - name: Google Services Yapılandırmasını Doğrula
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "google-services.json bulunamadı, derleme için yer tutucu oluşturuluyor..."
            mkdir -p app
            echo '{"project_info":{"project_number":"1053897004873","project_id":"gen-lang-client-0343498023","storage_bucket":"gen-lang-client-0343498023.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:1053897004873:android:a5488f645553ac684a6c98","android_client_info":{"package_name":"com.aistudio.biriz.sclvpk"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyMockKeyForBuild"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Android APK'sını Derle (Biriz.apk)
        run: |
          ./gradlew assembleDebug -PGITHUB_RUN_NUMBER=${{ github.run_number }} -PGITHUB_REPOSITORY=${{ github.repository }} --no-daemon

      - name: Çıktı Dosyalarını ve Sürüm Bilgilerini Hazırla
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Biriz.apk
          cp app/build/outputs/apk/debug/app-debug.apk "release-output/Biriz-v1.0.${{ github.run_number }}.apk"

          RUN_NUM="${{ github.run_number }}"
          REPO="${{ github.repository }}"
          VERSION_CODE=$((1000 + RUN_NUM))

          cat <<EOF > release-output/version.json
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "1.0.${RUN_NUM}",
            "tag": "v1.0.${RUN_NUM}",
            "apkUrl": "https://github.com/${REPO}/releases/download/v1.0.${RUN_NUM}/Biriz.apk",
            "appName": "BİRİZ",
            "releaseNotes": "BİRİZ v1.0.${RUN_NUM} otomatik derlemesi oluşturuldu."
          }
          EOF

          cat <<EOF > release-notes.md
          ### 🚀 BİRİZ Android Uygulaması (v1.0.${RUN_NUM})

          Bu sürüm GitHub senkronizasyonu ile otomatik olarak derlenmiştir.

          #### 📲 İndirme Seçenekleri:
          - **Doğrudan APK İndir:** [Biriz.apk](https://github.com/${REPO}/releases/download/v1.0.${RUN_NUM}/Biriz.apk)
          - **Sürümlü APK:** [Biriz-v1.0.${RUN_NUM}.apk](https://github.com/${REPO}/releases/download/v1.0.${RUN_NUM}/Biriz-v1.0.${RUN_NUM}.apk)

          *Uygulamayı açtığınızda otomatik olarak yeni sürüm uyarısı verilecek veya Ayarlar > Güncellemeleri Denetle butonuyla da tek tıkla güncelleyebilirsiniz.*
          EOF

      - name: GitHub Sürümü (Release) Oluştur ve APK'yı Yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            release-output/Biriz.apk \
            "release-output/Biriz-v1.0.${{ github.run_number }}.apk" \
            release-output/version.json \
            --title "BİRİZ v1.0.${{ github.run_number }}" \
            --notes-file release-notes.md

      - name: APK Dosyasını Artifact Olarak Sakla
        uses: actions/upload-artifact@v4
        with:
          name: "Biriz-APK-v1.0.${{ github.run_number }}"
          path: release-output/Biriz.apk
          retention-days: 30
