name: Deploy Tahta

on:
  push:
    branches: [main]
    paths:
      - "app/src/main/assets/tahta.html"
      - "tahta-cloudflare/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tahta.html'i hazirla
        run: |
          mkdir -p tahta-cloudflare/public
          cp app/src/main/assets/tahta.html tahta-cloudflare/public/tahta.html

      - name: Wrangler CLI kur
        run: npm install -g wrangler

      - name: Cloudflare'a deploy et
        working-directory: tahta-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: wrangler deploy
